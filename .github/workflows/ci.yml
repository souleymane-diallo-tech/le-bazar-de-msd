name: Quality
on:
  pull_request:
  push:
    branches: [main, "feat/**", "features/**"]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: msd
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: msd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U msd -d msd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://msd:ci-only-password@localhost:5432/msd_dev
      DIRECT_URL: postgresql://msd:ci-only-password@localhost:5432/msd_dev
      TEST_DATABASE_URL: postgresql://msd:ci-only-password@localhost:5432/msd_test
      BETTER_AUTH_SECRET: ci-only-not-production-secret-at-least-32-characters
      PAYMENT_MODE: disabled
      CHECKOUT_MODE: demo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: node scripts/ci-databases.mjs
      - run: npm run db:migrate
      - run: npm run db:migrate
        env:
          DIRECT_URL: postgresql://msd:ci-only-password@localhost:5432/msd_test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run db:seed:demo
      - run: npm run db:seed:delivery-demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
